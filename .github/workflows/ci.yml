name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Test, vet, and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
      DOTNET_CLI_HOME: ${{ github.workspace }}\.tools\dotnet-cli-home
      NUGET_PACKAGES: ${{ github.workspace }}\.tools\nuget-packages

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: true

      - name: Install pinned WiX
        shell: pwsh
        run: |
          dotnet tool install --tool-path .tools\wix wix --version 5.0.2
          & .\.tools\wix\wix.exe --version

      - name: Record focused PATH transaction restart evidence
        shell: pwsh
        run: |
          $evidence = '.tools\evidence\windows-msi-helper'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $pattern = 'Test(WriteSnapshotNeverOverwritesExistingState|PreflightClaimAllowsCurrentTransactionSnapshotPublication|PublishSnapshotNeverReplacesRacingFinalState|RollbackAndCommitNeverConsumePartialState|TransactionTeardownFailuresRemainSafelyRestartable)$'
          $jsonLines = @(& go test -count=1 -v -json .\cmd\inlaid-path-helper -run $pattern 2>&1)
          $testExitCode = $LASTEXITCODE
          $jsonPath = Join-Path $evidence 'focused-transaction-tests.jsonl'
          $logPath = Join-Path $evidence 'focused-transaction-tests.log'
          $jsonLines | Set-Content -LiteralPath $jsonPath -Encoding utf8NoBOM
          @($jsonLines | ForEach-Object {
            try { $event = $_ | ConvertFrom-Json; if ($null -ne $event.Output) { $event.Output.TrimEnd([char[]]"`r`n") } }
            catch { [string]$_ }
          }) | Set-Content -LiteralPath $logPath -Encoding utf8NoBOM
          [ordered]@{
            schema = 1
            command = 'go test -count=1 -v -json .\cmd\inlaid-path-helper -run <focused-pattern>'
            pattern = $pattern
            exitCode = $testExitCode
            jsonlSHA256 = (Get-FileHash -LiteralPath $jsonPath -Algorithm SHA256).Hash
            logSHA256 = (Get-FileHash -LiteralPath $logPath -Algorithm SHA256).Hash
            composition = 'Unit fault injection for transaction publication/activation/cleanup/restart behavior; static MSI sequencing and live lifecycle evidence remain separate inputs.'
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $evidence 'focused-transaction-tests-summary.json') -Encoding utf8NoBOM
          if ($testExitCode -ne 0) { throw "Focused PATH transaction tests failed with exit code $testExitCode." }

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Scan known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Build dashboard
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          go build -trimpath -ldflags "-X main.version=v0.0.0-ci" -o bin\inlaid.exe .\cmd\inlaid

      - name: Smoke-test Windows release package
        shell: pwsh
        run: .\scripts\test-release-package.ps1 -Version v0.0.0-ci

      - name: Build and inspect strict per-user MSI fixtures
        shell: pwsh
        run: .\scripts\test-windows-msi-package.ps1 -Wix .\.tools\wix\wix.exe -OutputDirectory .\.tools\evidence\windows-msi-package

      - name: Exercise per-user MSI lifecycle
        shell: pwsh
        run: .\scripts\test-windows-msi-as-standard-user.ps1 -Wix .\.tools\wix\wix.exe -ChildTimeoutSeconds 2400 -AcceptLocalUserSetup

      - name: Upload Windows MSI package and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msi-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tools/evidence/windows-msi-package
            .tools/evidence/windows-msi-lifecycle
            .tools/evidence/windows-msi-standard-user
            .tools/evidence/windows-msi-helper
          if-no-files-found: warn
          retention-days: 14

  linux:
    name: Test, vet, and build (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: true

      - name: Install native camera dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libturbojpeg0-dev pkg-config

      - name: Test
        run: go test ./...

      - name: Check concurrent ownership paths
        run: go test -race ./internal/capture ./internal/celllive ./internal/celltape ./internal/dashboard ./internal/supportreport ./internal/taperecovery

      - name: Vet
        run: go vet ./...

      - name: Scan known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Build dashboard
        run: |
          mkdir -p bin
          go build -trimpath -o bin/inlaid ./cmd/inlaid

  macos:
    name: Test, vet, and build (macOS Arm)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Scan known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Build dashboard
        run: |
          mkdir -p bin
          go build -trimpath -o bin/inlaid ./cmd/inlaid

      - name: Verify camera privacy declaration
        run: |
          xcrun segedit bin/inlaid -extract __TEXT __info_plist embedded-info.plist
          plutil -lint embedded-info.plist
          usage="$(plutil -extract NSCameraUsageDescription raw -o - embedded-info.plist)"
          test "$usage" = "Inlaid uses the camera you choose to render live video in your terminal."
