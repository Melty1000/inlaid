name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Native validation
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  windows-release:
    name: Windows release
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $semver = '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
          if ($tag -notmatch $semver) {
            throw "Release tag is not a supported semantic version: $tag"
          }
          $version = $tag.Substring(1)
          $notes = Join-Path 'docs\releases' "$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes were not found: $notes"
          }
          $changelog = Get-Content -LiteralPath 'CHANGELOG.md' -Raw
          if (-not $changelog.Contains("## [$version] - ")) {
            throw "CHANGELOG.md has no dated $version release section."
          }

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Scan known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Build dashboard
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          go build -trimpath -ldflags "-s -w -X main.version=$env:RELEASE_TAG" -o bin\inlaid.exe .\cmd\inlaid
          $reported = & .\bin\inlaid.exe --version
          if ($LASTEXITCODE -ne 0 -or $reported -ne "Inlaid $env:RELEASE_TAG") {
            throw "Release executable identity mismatch: $reported"
          }

      - name: Package without FFmpeg
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: .\scripts\package-release.ps1 -Version $env:RELEASE_TAG

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inlaid-${{ github.ref_name }}-windows-amd64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:RELEASE_TAG
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName })
          $notes = Join-Path 'docs\releases' "$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes were not found: $notes"
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; refusing to replace published assets."
          }
          if ($tag -match '-') {
            gh release create $tag @assets --verify-tag --notes-file $notes --prerelease --title "Inlaid $tag"
          }
          else {
            gh release create $tag @assets --verify-tag --notes-file $notes --title "Inlaid $tag"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publishing failed with exit code $LASTEXITCODE."
          }
